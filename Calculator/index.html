<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mini Calculator</h1>
    <section id="calc_body">
      <section id="result_group">
        <h4 id="calculation"></h4>
        <h3 id="result"></h3>
      </section>
      <section id="btn-group">
        <button id="b1">×</button>
        <button id="b2">÷</button>
        <button id="b3">-</button>
        <button id="b4">+</button>
        <button id="b5">9</button>
        <button id="b6">8</button>
        <button id="b7">7</button>
        <button id="b8">6</button>
        <button id="b9">5</button>
        <button id="b10">4</button>
        <button id="b11">3</button>
        <button id="b12">2</button>
        <button id="b13">1</button>
        <button id="b14">0</button>
        <button id="b15">.</button>
        <button id="b16">=</button>
        <button id="b17">c</button>
      </section>
    </section>
    <script src="app.js"></script>
  </body>
</html>
